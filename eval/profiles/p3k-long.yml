# Alvo ~3k. So o transporte (read, write) mais bash no topo.
# Perde: chamada nativa de grep, que e o alvo do interceptador de bash.
# E o degrau onde a qualidade deve quebrar. Medir, nao supor.
tools:
  xdevForceMount: [hub, eval, task, todo, web_search, edit, glob, grep]
  xdevDocs: catalog
personality: none
includeModelInPrompt: false
promptProfile: compact

# Long sessions on this 36 GB machine: the oMLX process hits its 24.9 GB hard
# watermark near 22-24k tokens of context, so compaction must fire before that.
compaction:
  thresholdTokens: 20000
  keepRecentTokens: 3000
  reserveTokens: 2500
